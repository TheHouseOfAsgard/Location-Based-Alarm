name: location_alarm
description: Location-based alarm that rings when you get within a chosen radius of a destination.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.2
  geolocator: 13.0.2
  permission_handler: 11.3.1
  flutter_background_service: 5.0.10
  flutter_map: 7.0.2
  latlong2: 0.9.1
  audioplayers: 6.1.0
  vibration: 2.0.1
  flutter_volume_controller: 1.3.2
  flutter_local_notifications: 18.0.1
  shared_preferences: 2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.mp3
